<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Сложный участок на закате">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1117"/>
      <stop offset="100%" stop-color="#111a22"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2c1f"/>
      <stop offset="100%" stop-color="#1d2d20"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#ffd34f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffd34f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141a22"/>
      <stop offset="100%" stop-color="#2b323c"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5c63a"/>
      <stop offset="100%" stop-color="#f3bd22"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
    <g id="mower">
      <ellipse cx="230" cy="156" rx="170" ry="26" fill="#0a0f14" opacity="0.55" filter="url(#blur)"/>
      <rect x="60" y="98" width="330" height="95" rx="26" fill="url(#metal)" stroke="#3b4450" stroke-width="2"/>
      <rect x="94" y="74" width="180" height="58" rx="17" fill="url(#yellow)"/>
      <rect x="276" y="80" width="80" height="45" rx="12" fill="#1b222c"/>
      <circle cx="108" cy="196" r="35" fill="#1b212a" stroke="#4f5763" stroke-width="4"/>
      <circle cx="346" cy="196" r="35" fill="#1b212a" stroke="#4f5763" stroke-width="4"/>
      <rect x="145" y="48" width="165" height="16" rx="8" fill="#f1f5f8" opacity="0.75"/>
    </g>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <path d="M0,780 C260,620 520,620 820,700 C1080,760 1300,720 1600,620 L1600,1000 L0,1000 Z" fill="url(#ground)"/>
  
  
  
  <g opacity="0.25"><circle cx="1320" cy="210" r="120" fill="url(#sun)"/></g>
  
  <g transform="translate(620 610) scale(1.08)"><use href="#mower"/></g>
  
  <rect width="1600" height="1000" fill="url(#sun)" opacity="0.16"/>
</svg>